services:
  ollama:
    image: docker.io/ollama/ollama:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - keep-groups
    environment:
      # RX 6650 XT = gfx1032, sin soporte oficial de ROCm; se hace pasar por gfx1030
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

  db:
    image: docker.io/pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rarca
      POSTGRES_PASSWORD: rarca
      POSTGRES_DB: rarca
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z

volumes:
  ollama:
  pgdata:
